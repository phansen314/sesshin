# Release: on a version tag, check the tag's CHANGELOG section with
# scripts/release-notes.sh, test, build the Linux archives with
# scripts/release-build.sh, and publish them as the tag's GitHub release, with
# that section as its notes.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag, so Go stamps it as the binaries' version
      # First, so a tag without a dated CHANGELOG section fails at once.
      - name: Notes
        env:
          REPO: ${{ github.repository }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "$REPO" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go version
        run: go version

      - name: Plugin version matches the tag
        run: |
          got=$(jq -r .version .claude-plugin/plugin.json)
          if [[ $got != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::.claude-plugin/plugin.json has version $got, not ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...
      - name: Fetch fzf
        run: echo "SESSHIN_E2E_FZF=$(scripts/fetch-fzf.sh "$RUNNER_TEMP/fzf")" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./...

      - name: Build
        run: scripts/release-build.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
